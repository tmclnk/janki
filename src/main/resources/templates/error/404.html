<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
    <title th:text="${pageTitle}">Not Found</title>
</head>
<body>
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <div class="py-5">
                    <h1 class="display-1 fw-bold text-primary mb-4">404</h1>
                    <h2 class="display-5 mb-4">Page Not Found</h2>
                    <p class="lead text-muted mb-4" th:if="${message}" th:text="${message}">
                        The page you are looking for could not be found.
                    </p>
                    <p class="lead text-muted mb-4" th:unless="${message}">
                        The page you are looking for could not be found.
                    </p>
                    <a href="/" class="btn btn-primary btn-lg">
                        <i class="bi bi-house-door"></i> Go Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
