<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head>
    <title th:text="${pageTitle}">Error</title>
</head>
<body>
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <div class="py-5">
                    <h1 class="display-1 fw-bold text-danger mb-4">500</h1>
                    <h2 class="display-5 mb-4">Something Went Wrong</h2>
                    <p class="lead text-muted mb-4">
                        We're sorry, but something unexpected happened. Our team has been notified and we're working to fix the issue.
                    </p>
                    <a href="/" class="btn btn-primary btn-lg">
                        <i class="bi bi-house-door"></i> Go Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
