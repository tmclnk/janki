<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">
<head>
    <title>My Decks</title>
</head>
<body>
    <div th:fragment="content">
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="display-5 fw-bold" th:text="${pageTitle}">My Decks</h1>
            <a href="/decks/new" class="btn btn-primary btn-lg">
                <i class="bi bi-plus-circle"></i> New Deck
            </a>
        </div>

        <!-- Empty State -->
        <div th:if="${decks == null || decks.isEmpty()}" class="text-center py-5">
            <div class="mb-4">
                <i class="bi bi-inbox" style="font-size: 4rem; color: #6c757d;"></i>
            </div>
            <h3 class="text-muted mb-3">No decks yet</h3>
            <p class="text-muted mb-4">Get started by creating your first flashcard deck!</p>
            <a href="/decks/new" class="btn btn-primary btn-lg">
                <i class="bi bi-plus-circle"></i> Create Your First Deck
            </a>
        </div>

        <!-- Deck Grid -->
        <div th:unless="${decks == null || decks.isEmpty()}" class="row g-4">
            <div th:each="deck : ${decks}" class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title mb-3" th:text="${deck.name}">Deck Name</h5>
                        <p class="card-text text-muted flex-grow-1"
                           th:text="${deck.description != null && !deck.description.isEmpty() ? deck.description : 'No description'}">
                            Deck description goes here
                        </p>

                        <!-- Deck Metadata -->
                        <div class="text-muted small mb-3">
                            <div>
                                <i class="bi bi-calendar-plus"></i>
                                Created: <span th:text="${#temporals.format(deck.createdAt, 'MMM dd, yyyy')}">Jan 01, 2026</span>
                            </div>
                            <div th:if="${deck.updatedAt != null && !deck.updatedAt.equals(deck.createdAt)}">
                                <i class="bi bi-calendar-check"></i>
                                Updated: <span th:text="${#temporals.format(deck.updatedAt, 'MMM dd, yyyy')}">Jan 01, 2026</span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-2">
                            <a th:href="@{/study/decks/{id}(id=${deck.id})}"
                               class="btn btn-primary flex-fill">
                                <i class="bi bi-play-circle"></i> Study
                            </a>
                            <a th:href="@{/decks/{id}(id=${deck.id})}"
                               class="btn btn-outline-secondary">
                                <i class="bi bi-eye"></i> View
                            </a>
                            <a th:href="@{/decks/{id}/edit(id=${deck.id})}"
                               class="btn btn-outline-secondary">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Icons (already included in layout) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
</body>
</html>
